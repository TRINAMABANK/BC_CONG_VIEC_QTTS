<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#005EA6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Inner circular badge -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
  
  <!-- Clipboard / Document Graphic -->
  <rect x="156" y="140" width="200" height="260" rx="24" fill="#ffffff" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.3))"/>
  
  <!-- Clipboard Top Clip -->
  <rect x="206" y="115" width="100" height="42" rx="12" fill="url(#accentGrad)"/>
  <circle cx="256" cy="136" r="10" fill="#003366"/>
  
  <!-- Document Lines -->
  <!-- Line 1 with checkmark -->
  <circle cx="196" cy="205" r="14" fill="#16a34a"/>
  <path d="M190 205 l4 4 l8 -8" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="226" y="197" width="105" height="15" rx="6" fill="#627d98"/>

  <!-- Line 2 with checkmark -->
  <circle cx="196" cy="255" r="14" fill="#16a34a"/>
  <path d="M190 255 l4 4 l8 -8" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="226" y="247" width="95" height="15" rx="6" fill="#627d98"/>

  <!-- Line 3 with pending circle -->
  <circle cx="196" cy="305" r="14" fill="#f59e0b"/>
  <path d="M196 298 v8 h6" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="226" y="297" width="115" height="15" rx="6" fill="#627d98"/>

  <!-- Line 4 -->
  <rect x="186" y="347" width="145" height="12" rx="5" fill="#cbd5e1"/>

  <!-- Text / Monogram "QTTS" on bottom -->
  <text x="256" y="455" font-family="'Times New Roman', Times, serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">BP QTTS</text>
</svg>
